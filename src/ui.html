<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Export Pro</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    font-size: 12px;
    color: var(--figma-color-text, #1e1e1e);
    background: var(--figma-color-bg, #ffffff);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--figma-color-border, #e5e5e5);
  }
  .title { font-weight: 600; font-size: 13px; }
  .status { font-size: 11px; }
  .status.ok { color: var(--figma-color-text-success, #14ae5c); }
  .status.muted { color: var(--figma-color-text-secondary, #808080); }

  .list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--figma-color-text-secondary, #808080); text-align: center; padding: 24px 8px; }

  .row {
    display: grid;
    grid-template-columns: 72px 74px 1fr 64px 74px auto;
    gap: 6px;
    align-items: end;
    border: 1px solid var(--figma-color-border, #e5e5e5);
    border-radius: 6px;
    padding: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .field label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--figma-color-text-secondary, #808080); }
  input, select {
    font-size: 11px; padding: 4px 6px; border-radius: 4px; width: 100%;
    border: 1px solid var(--figma-color-border, #cccccc);
    background: var(--figma-color-bg, #ffffff); color: inherit;
  }
  .scale-field { display: flex; align-items: center; gap: 3px; }
  .scale-field span { font-size: 11px; color: var(--figma-color-text-secondary, #808080); }

  .row-actions { display: flex; flex-direction: column; gap: 4px; }
  .mini-btn {
    border: none; border-radius: 4px; padding: 5px 8px; cursor: pointer; font-size: 11px;
    background: var(--figma-color-bg-secondary, #f0f0f0); color: inherit;
  }
  .mini-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .mini-btn.danger { color: var(--figma-color-text-danger, #f24822); }

  .add-btn {
    margin: 0 12px 10px; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 11px;
    border: 1px dashed var(--figma-color-border, #cccccc); background: transparent; color: inherit;
  }

  .footer { padding: 12px; border-top: 1px solid var(--figma-color-border, #e5e5e5); }
  .primary-btn {
    width: 100%; padding: 9px; border-radius: 6px; border: none; cursor: pointer;
    font-weight: 600; font-size: 12px; color: #ffffff;
    background: var(--figma-color-bg-brand, #18a0fb);
  }
  .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/*__INLINE_SCRIPT__*/
</script>
</body>
</html>
